<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Region IX - Authentication Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper" style="position: relative; height: 100vh;">
        <div class="auth-card">
            <div class="brand">
                <i class="fa-solid fa-shield-halved" style="color: var(--accent-blue);"></i>
                <span>REGION IX PORTAL</span>
            </div>

            <div class="tab-btn-group">
                <button class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
                <button class="tab-btn" id="tab-register" onclick="switchAuthTab('register')">Register Account</button>
            </div>

            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" class="form-control" placeholder="Enter username" required />
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Enter password" required />
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 16px;">Sign In</button>
            </form>

            <form id="form-register" onsubmit="handleRegister(event)" style="display: none;">
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" class="form-control" placeholder="Username" required />
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Password" required />
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <label for="reg-badge">Badge / ID Serial No</label>
                    <input type="text" id="reg-badge" class="form-control" placeholder="e.g. GO-0001, 09-1012, or O09-1012" required />
                    <small style="color: var(--text-muted); font-size: 0.75rem; margin-top: 2px;">GO = GOV Dept | 09- or O09- = PNP Dept</small>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 16px;">Submit Application</button>
            </form>

            <div id="auth-status-msg" class="status-msg"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Redirect to hub if already logged in
        if (localStorage.getItem('staffToken')) {
            window.location.href = 'hub.html';
        }
    </script>
</body>
</html>
